# Central configuration: paths, entry-point objects, seed, cohort and the polarization schema.
# Python: config/config.py; R: config/config.R. ${VAR:-default} values are read from the environment.
#
# Set DATA_ROOT to the folder that holds the deposited data and OUTPUT_ROOT to where outputs go.

paths:
  # Root holding the deposited input objects (atlas h5ad, Xenium SFE folders). Not shipped in the repo.
  data_root:   "${DATA_ROOT:-/path/to/deposit}"
  # Where pipeline outputs (tables, intermediate caches, figures) are written.
  output_root: "${OUTPUT_ROOT:-./output}"
  figures_dir: "${OUTPUT_ROOT:-./output}/figures"
  # Organoid (PDO) project folder (Fig 3). Override ORGANOIDS_ROOT (absolute) to point elsewhere.
  # Used via cfg_path("organoids_root", ...) / path("organoids_root", ...).
  organoids_root: "${ORGANOIDS_ROOT:-/path/to/deposit/202603_organoids}"

# Entry-point objects, relative to data_root.
objects:
  atlas_scanvi:       "2026_final_atlas/hgsc_atlas_scanvi.h5ad"        # integrated atlas (scVI -> scANVI; atlas/01_preprocess_qc)
  atlas_final:        "2026_final_atlas/hgsc_atlas_final.h5ad"          # final annotated atlas, the start of every atlas figure
  xenium_ref:         "2026_final_atlas/output/xenium_celltype/xenium_celltype_downsampled.h5ad"  # SingleR reference
  # The integration's intermediate objects (preprocessed.h5ad, CellAssign predictions, scVI / scANVI models and
  # embeddings, integrated_scanvi.h5ad) are regenerated under output_root/01_preprocess_qc/integration/, not
  # deposited. Its input is atlas_concatenated_filtered.h5ad (QC- and Scrublet-filtered concatenated counts).
  sfe_dir:            "2026_final_xenium_analysis/output/sfe"
  # ICON7 (GSE140082): per-patient scored cohort and result tables (icon7/scripts), and the gene-symbol x sample
  # expression matrix collapsed from the HumanHT-12 probes (read by Table S6 for gene presence).
  icon7_cohort:       "2026_final_xenium_analysis/davids side quests/ICON7/data/processed/cohort_filtered.tsv"
  icon7_results_dir:  "2026_final_xenium_analysis/davids side quests/ICON7/results/tables"
  icon7_expr:         "2026_final_xenium_analysis/davids side quests/ICON7/data/processed/expr_gene_symbol.rds"

# Seed for every stochastic step (cell labelling, consensusOV random forest, NMF initialisation, subsampling).
seed: 42

cohort:
  # Xenium whole tissues of the paper (study codes).
  whole_tissue:   [WT01, WT02, WT03, WT04, WT05, WT06, WT07, WT08]
  # TMA B blocks G and H, de-arrayed with the interactive editor (spatial/01_build_sfe); TMA A is sfe_tma.
  tma_new:        [COEUR_TMA_G, COEUR_TMA_H]

# Epithelial polarization schema (NMF Factor 2 percentile partition).
polarization:
  factor: "Factor_2"                 # SecB-defining NMF factor
  partition: {SecA: "<p50", Intermediate: "p50-p75", SecB: ">=p75"}
  labels: [SecA, Intermediate, SecB, Ciliated]
